name: Test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # cang compiles libkrun's Rust API out of `deps/libkrun`, so the
          # submodule has to be in the checkout.
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run tests
        run: |
          nix develop --command cargo test \
            --package cang \
            --package cang-guest-init \
            --package cang-attach-protocol \
            --package cang-exec-protocol \
            --package cang-repository-tests

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # cang compiles libkrun's Rust API out of `deps/libkrun`, so the
          # submodule has to be in the checkout.
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check formatting
        run: nix develop --command cargo fmt --check

      - name: Lint
        run: nix develop --command cargo clippy --all-targets --all-features -- -D warnings

      - name: Check dependency policy
        run: nix develop --command cargo deny check

  flake-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # cang compiles libkrun's Rust API out of `deps/libkrun`, so the
          # submodule has to be in the checkout.
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run flake checks
        run: nix flake check -L
