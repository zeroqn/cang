name: Build and publish virglrenderer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-virglrenderer.yml
      # The source revision, the patch set, the selector and the prebuilt
      # consumer all change what this workflow builds and publishes.
      - nix/pins.nix
      - nix/lib/virglrenderer-cang.nix
      - nix/lib/virglrenderer-patched.nix
      - nix/pkgs/virglrenderer-prebuilt.nix
      - nix/pkgs/patches/virglrenderer-*.patch
      # `virglrenderer-release-build` is defined in flake.nix and built from the
      # locked nixpkgs, so a flake or lock move can change what it builds against.
      - flake.nix
      - flake.lock
  schedule:
    # Weekly: float the nixpkgs lock and rebuild when the libva/virglrenderer
    # stack it builds against moved.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force a virglrenderer rebuild even when the source revision is unchanged'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: virglrenderer-main-build
  cancel-in-progress: false

jobs:
  update-and-build-virglrenderer:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        # No submodule checkout: every step here is a Nix build, and the flake
        # compiles the fork sources from its `libkrun-src`/`libkrunfw-src`/
        # `rutabaga-gfx-src` inputs.

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Assert CI-required package attributes exist
        # Mirror the sibling workflow's output-contract check: this workflow
        # evaluates and builds these attributes, so a rename has to fail here
        # instead of silently breaking CI. Check attribute presence (`?`) rather
        # than forcing the derivation.
        run: |
          set -euo pipefail

          present="$(nix eval --impure --json --expr '
            let
              flake = builtins.getFlake (toString ./.);
              system = builtins.currentSystem;
              required = [ "virglrenderer-release-build" "virglrenderer" ];
            in
            builtins.all (name: flake.packages.${system} ? ${name}) required
          ')"
          if [ "${present}" != "true" ]; then
            echo "missing a CI-required virglrenderer package attribute (virglrenderer-release-build, virglrenderer)" >&2
            exit 1
          fi
          echo "ok: packages.<system>.{virglrenderer-release-build,virglrenderer}"

      - name: Update nixpkgs input
        # Only the weekly run floats nixpkgs; push runs build the pinned lock.
        if: github.event_name == 'schedule'
        run: nix flake update nixpkgs

      - name: Extract the source revision and version
        id: version
        run: |
          set -euo pipefail

          # The pinned upstream revision is the rebuild key: nixpkgs' virglrenderer
          # version stays 1.3.0 while the revision moves. The asset name carries
          # the revision so an upload is traceable.
          revision="$(nix eval --raw --impure \
            --expr '(import ./nix/pins.nix).virglrendererSource.rev')"
          upstream="$(nix eval --raw .#virglrenderer-release-build.version)"
          if [ -z "${revision}" ] || [ -z "${upstream}" ]; then
            echo "nix eval returned an empty virglrenderer revision or version" >&2
            exit 1
          fi
          # cang's own patch set changes the artefact as much as the upstream
          # revision does, so it is part of the key: without it a patch change
          # leaves the earlier tarball - and the pin pointing at it - in place,
          # and the fix the patch carries never ships.
          patch_hash="$(cat nix/pkgs/patches/virglrenderer-*.patch \
            nix/lib/virglrenderer-patched.nix | sha256sum | cut -c1-8)"
          version="${upstream}-${revision:0:8}-p${patch_hash}"
          echo "patch_hash=${patch_hash}" >> "${GITHUB_OUTPUT}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Detected virglrenderer ${version} (revision ${revision})"

      - name: Check whether virglrenderer needs a rebuild
        id: check-version
        env:
          REVISION: ${{ steps.version.outputs.revision }}
          VERSION: ${{ steps.version.outputs.version }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64) system="x86_64-linux" ;;
            aarch64 | arm64) system="aarch64-linux" ;;
            *)
              echo "unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          pinned_revision="$(nix eval --raw --impure \
            --expr '(import ./nix/pins.nix).virglrendererPrebuiltRelease.revision' || true)"
          pinned_system="$(nix eval --raw --impure \
            --expr "if builtins.hasAttr \"${system}\" (import ./nix/pins.nix).virglrendererPrebuiltRelease.systems then \"true\" else \"false\"" \
            || echo false)"

          locked_rev="$(git show HEAD:flake.lock | jq -r '.nodes.nixpkgs.locked.rev // empty' 2>/dev/null || true)"
          work_rev="$(jq -r '.nodes.nixpkgs.locked.rev // empty' flake.lock 2>/dev/null || true)"

          echo "System:              ${system}"
          echo "Pinned revision:     ${pinned_revision:-<none>}"
          echo "Source revision:     ${REVISION}"
          echo "Pinned ${system}:     ${pinned_system}"
          echo "Committed nixpkgs:   ${locked_rev}"
          echo "Lock nixpkgs:        ${work_rev}"

          changed=false
          if [ "${REVISION}" != "${pinned_revision}" ]; then
            echo "virglrenderer source revision changed (${pinned_revision:-<none>} -> ${REVISION})"
            changed=true
          fi
          if [ "${pinned_system}" != "true" ]; then
            echo "nix/pins.nix has no prebuilt virglrenderer asset for ${system}"
            changed=true
          fi
          if [ -n "${locked_rev}" ] && [ -n "${work_rev}" ] && [ "${locked_rev}" != "${work_rev}" ]; then
            echo "nixpkgs input moved (${locked_rev} -> ${work_rev}); rebuilding for the new libva stack"
            changed=true
          fi
          # The pinned version carries the patch-set hash as well as the source
          # revision, so a patch change is detected the same way a revision move
          # is.
          pinned_version="$(nix eval --raw --impure \
            --expr '(import ./nix/pins.nix).virglrendererPrebuiltRelease.version' 2>/dev/null || true)"
          if [ "${pinned_version}" != "${VERSION}" ]; then
            echo "the published virglrenderer pin is ${pinned_version:-<none>} and this tree builds ${VERSION}"
            changed=true
          fi
          if [ "${FORCE_REBUILD}" = "true" ]; then
            echo "manual force_rebuild requested"
            changed=true
          fi

          echo "system=${system}" >> "${GITHUB_OUTPUT}"
          if [ "${changed}" = "true" ]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "version_changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Report virglrenderer unchanged
        if: steps.check-version.outputs.version_changed == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SYSTEM: ${{ steps.check-version.outputs.system }}
        run: |
          echo "virglrenderer ${VERSION} is already published for ${SYSTEM} and neither the source revision, the nixpkgs lock, nor a force request changed; skipping."

      - name: Confirm workflow commit is current main
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Build virglrenderer
        if: steps.check-version.outputs.version_changed == 'true'
        run: |
          set -euo pipefail

          if ! nix build .#virglrenderer-release-build \
            --out-link result-virglrenderer \
            --print-build-logs 2>&1 | tee build.log; then
            echo "virglrenderer build failed -- the patch set or the vendored venus-protocol subproject may need updating"
            tail -n 200 build.log
            exit 1
          fi

      - name: Package virglrenderer
        id: package
        if: steps.check-version.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SYSTEM: ${{ steps.check-version.outputs.system }}
        run: |
          set -euo pipefail

          archive="virglrenderer-${VERSION}-${SYSTEM}.tar.gz"
          virglrenderer_dir="$(readlink -f result-virglrenderer)"

          # The reconstruction in nix/pkgs/virglrenderer-prebuilt.nix relies on
          # these; fail before publishing a tarball that would break the prebuilt
          # consumer.
          test -f "${virglrenderer_dir}/lib/libvirglrenderer.so.1"
          test -f "${virglrenderer_dir}/libexec/virgl_render_server"
          test -f "${virglrenderer_dir}/lib/pkgconfig/virglrenderer.pc"
          test -f "${virglrenderer_dir}/include/virgl/virglrenderer.h"

          tar -czf "${archive}" -C "${virglrenderer_dir}" .
          sha256sum "${archive}" > "${archive}.sha256"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Attest virglrenderer archive
        if: steps.check-version.outputs.version_changed == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Upload virglrenderer release assets
        if: steps.check-version.outputs.version_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail

          # `alpha` is cang's rolling prerelease. `publish_release.yml` owns its
          # lifecycle and creates it on every push to main; only fill the gap when
          # this workflow runs before it ever has.
          if ! gh release view alpha > /dev/null 2>&1; then
            gh release create alpha --title alpha --prerelease --target "${GITHUB_SHA}" || true
          fi
          gh release upload alpha "${ARCHIVE}" "${ARCHIVE}.sha256" --clobber

      - name: Update the virglrenderer prebuilt pin
        if: steps.check-version.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ steps.version.outputs.revision }}
          SYSTEM: ${{ steps.check-version.outputs.system }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail

          # Hash the tarball this run uploaded (no download race) and write
          # nix/pins.nix with the same updater a maintainer runs by hand.
          bash scripts/update-virglrenderer-prebuilt.sh \
            --tag alpha \
            --system "${SYSTEM}" \
            --version "${VERSION}" \
            --revision "${REVISION}" \
            --asset "${ARCHIVE}" \
            --asset-path "${ARCHIVE}"

      - name: Commit the virglrenderer prebuilt pin
        if: steps.check-version.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          git add flake.lock nix/pins.nix
          if git diff --cached --quiet; then
            echo "no pin change to commit"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update virglrenderer prebuilt release pin to ${VERSION}"
          git push origin HEAD:main
