name: Build and publish zg

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-zg.yml
      # The source revision, the selector, the prebuilt consumer and the C API
      # release pin all change what this workflow builds and publishes.
      - nix/pins.nix
      - nix/lib/zvec-grep-cang.nix
      - nix/pkgs/zvec-grep.nix
      - nix/pkgs/zvec-grep-prebuilt.nix
      - nix/pkgs/zvec-rust-lib.nix
      # `zvec-grep-release-build` is defined in flake.nix and built from the
      # locked nixpkgs, so a flake or lock move can change what it builds against.
      - flake.nix
      - flake.lock
  schedule:
    # Weekly: float the nixpkgs lock and rebuild when the rustc or ONNX Runtime
    # the zg workspace builds against moved.
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force a zg rebuild even when the source revision is unchanged'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: zg-main-build
  cancel-in-progress: false

jobs:
  update-and-build-zg:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        # No submodule checkout: every step here is a Nix build, and the flake
        # compiles the fork sources from its `libkrun-src`/`libkrunfw-src`/
        # `rutabaga-gfx-src` inputs.

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Assert CI-required package attributes exist
        # Mirror the sibling workflows' output-contract check: this workflow
        # evaluates and builds these attributes, so a rename has to fail here
        # instead of silently breaking CI. Check attribute presence (`?`) rather
        # than forcing the derivation.
        run: |
          set -euo pipefail

          present="$(nix eval --impure --json --expr '
            let
              flake = builtins.getFlake (toString ./.);
              system = builtins.currentSystem;
              required = [ "zvec-grep-release-build" "zvec-grep" ];
            in
            builtins.all (name: flake.packages.${system} ? ${name}) required
          ')"
          if [ "${present}" != "true" ]; then
            echo "missing a CI-required zg package attribute (zvec-grep-release-build, zvec-grep)" >&2
            exit 1
          fi
          echo "ok: packages.<system>.{zvec-grep-release-build,zvec-grep}"

      - name: Update nixpkgs input
        # Only the weekly run floats nixpkgs; push runs build the pinned lock.
        if: github.event_name == 'schedule'
        run: nix flake update nixpkgs nixpkgs-unstable

      - name: Extract the source revision and version
        id: version
        run: |
          set -euo pipefail

          # The pinned upstream revision is the rebuild key: the Rust workspace's
          # own `[workspace.package] version` is a never-bumped 0.0.1, so the
          # version nix/pkgs/zvec-grep.nix stamps does not move when the revision
          # does. The asset name carries both.
          revision="$(nix eval --raw --impure \
            --expr '(import ./nix/pins.nix).zvecGrep.rev')"
          version="$(nix eval --raw .#zvec-grep-release-build.version)"
          if [ -z "${revision}" ] || [ -z "${version}" ]; then
            echo "nix eval returned an empty zg revision or version" >&2
            exit 1
          fi
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Detected zg ${version} (revision ${revision})"

      - name: Check whether zg needs a rebuild
        id: check-version
        env:
          REVISION: ${{ steps.version.outputs.revision }}
          VERSION: ${{ steps.version.outputs.version }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64) system="x86_64-linux" ;;
            aarch64 | arm64) system="aarch64-linux" ;;
            *)
              echo "unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          pinned_revision="$(nix eval --raw --impure \
            --expr '(import ./nix/pins.nix).zgPrebuiltRelease.revision' || true)"
          pinned_version="$(nix eval --raw --impure \
            --expr '(import ./nix/pins.nix).zgPrebuiltRelease.version' || true)"
          pinned_system="$(nix eval --raw --impure \
            --expr "if builtins.hasAttr \"${system}\" (import ./nix/pins.nix).zgPrebuiltRelease.systems then \"true\" else \"false\"" \
            || echo false)"

          locked_rev="$(git show HEAD:flake.lock | jq -r '.nodes.nixpkgs.locked.rev // empty' 2>/dev/null || true)"
          work_rev="$(jq -r '.nodes.nixpkgs.locked.rev // empty' flake.lock 2>/dev/null || true)"

          echo "System:              ${system}"
          echo "Pinned revision:     ${pinned_revision:-<none>}"
          echo "Source revision:     ${REVISION}"
          echo "Pinned version:      ${pinned_version:-<none>}"
          echo "Source version:      ${VERSION}"
          echo "Pinned ${system}:     ${pinned_system}"
          echo "Committed nixpkgs:   ${locked_rev}"
          echo "Lock nixpkgs:        ${work_rev}"

          changed=false
          if [ "${REVISION}" != "${pinned_revision}" ]; then
            echo "zg source revision changed (${pinned_revision:-<none>} -> ${REVISION})"
            changed=true
          fi
          if [ "${VERSION}" != "${pinned_version}" ]; then
            echo "zg stamp changed (${pinned_version:-<none>} -> ${VERSION})"
            changed=true
          fi
          if [ "${pinned_system}" != "true" ]; then
            echo "nix/pins.nix has no prebuilt zg asset for ${system}"
            changed=true
          fi
          if [ -n "${locked_rev}" ] && [ -n "${work_rev}" ] && [ "${locked_rev}" != "${work_rev}" ]; then
            echo "nixpkgs input moved (${locked_rev} -> ${work_rev}); rebuilding for the new rustc/onnxruntime"
            changed=true
          fi
          if [ "${FORCE_REBUILD}" = "true" ]; then
            echo "manual force_rebuild requested"
            changed=true
          fi

          echo "system=${system}" >> "${GITHUB_OUTPUT}"
          if [ "${changed}" = "true" ]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "version_changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Report zg unchanged
        if: steps.check-version.outputs.version_changed == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SYSTEM: ${{ steps.check-version.outputs.system }}
        run: |
          echo "zg ${VERSION} is already published for ${SYSTEM} and neither the source revision, the stamp, the nixpkgs lock, nor a force request changed; skipping."

      - name: Confirm workflow commit is current main
        run: |
          set -euo pipefail

          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Build zg
        if: steps.check-version.outputs.version_changed == 'true'
        run: |
          set -euo pipefail

          if ! nix build .#zvec-grep-release-build \
            --out-link result-zg \
            --print-build-logs 2>&1 | tee build.log; then
            echo "zg build failed -- the Rust workspace or the zvec Rust pin may need updating"
            tail -n 200 build.log
            exit 1
          fi

      - name: Package zg
        id: package
        if: steps.check-version.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ steps.version.outputs.revision }}
          SYSTEM: ${{ steps.check-version.outputs.system }}
        run: |
          set -euo pipefail

          archive="zg-${VERSION}-${REVISION:0:8}-${SYSTEM}.tar.gz"
          zg_dir="$(readlink -f result-zg)"

          # The reconstruction in nix/pkgs/zvec-grep-prebuilt.nix relies on this;
          # fail before publishing a tarball that would break the prebuilt
          # consumer.
          test -f "${zg_dir}/bin/zg"
          "${zg_dir}/bin/zg" --version | grep -F "${VERSION}"

          tar -czf "${archive}" -C "${zg_dir}" .
          sha256sum "${archive}" > "${archive}.sha256"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Attest zg archive
        if: steps.check-version.outputs.version_changed == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Upload zg release assets
        if: steps.check-version.outputs.version_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail

          # `alpha` is cang's rolling prerelease. `publish_release.yml` owns its
          # lifecycle and creates it on every push to main; only fill the gap when
          # this workflow runs before it ever has.
          if ! gh release view alpha > /dev/null 2>&1; then
            gh release create alpha --title alpha --prerelease --target "${GITHUB_SHA}" || true
          fi
          gh release upload alpha "${ARCHIVE}" "${ARCHIVE}.sha256" --clobber

      - name: Update the zg prebuilt pin
        if: steps.check-version.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ steps.version.outputs.revision }}
          SYSTEM: ${{ steps.check-version.outputs.system }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail

          # Hash the tarball this run uploaded (no download race) and write
          # nix/pins.nix with the same updater a maintainer runs by hand.
          bash scripts/update-zg-prebuilt.sh \
            --tag alpha \
            --system "${SYSTEM}" \
            --version "${VERSION}" \
            --revision "${REVISION}" \
            --asset "${ARCHIVE}" \
            --asset-path "${ARCHIVE}"

      - name: Commit the zg prebuilt pin
        if: steps.check-version.outputs.version_changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          git add flake.lock nix/pins.nix
          if git diff --cached --quiet; then
            echo "no pin change to commit"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update zg prebuilt release pin to ${VERSION}"
          git push origin HEAD:main
