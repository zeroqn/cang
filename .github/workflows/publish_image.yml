name: Publish cang Image

on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: cang
            flake_attr: container-ci-sccache
            local_image: localhost/cang:latest
            init_binary: /bin/cang-guest-init
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        # No submodule checkout: the image build is a Nix build, and the flake
        # compiles the fork sources from its `libkrun-src`/`libkrunfw-src`
        # inputs.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Restore ${{ matrix.image_name }} sccache
        uses: actions/cache@v6
        with:
          path: /tmp/cang-ci-sccache-${{ matrix.image_name }}
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ matrix.image_name }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'nix/pins.nix') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-${{ matrix.image_name }}-
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-
      - name: Prepare ${{ matrix.image_name }} sccache directory
        run: |
          mkdir -p "/tmp/cang-ci-sccache-${{ matrix.image_name }}"
          sudo chown -R "$(id -u):$(id -g)" "/tmp/cang-ci-sccache-${{ matrix.image_name }}"
          chmod -R a+rwX "/tmp/cang-ci-sccache-${{ matrix.image_name }}"
      - name: Build ${{ matrix.image_name }} container archive
        run: |
          nix build \
            --option extra-sandbox-paths "/nix/var/cache/sccache=/tmp/cang-ci-sccache-${{ matrix.image_name }}" \
            ".#${{ matrix.flake_attr }}" \
            -o "result-${{ matrix.image_name }}-container" \
            --print-out-paths > "${{ matrix.image_name }}-container-path.txt"
      - name: Normalize ${{ matrix.image_name }} sccache permissions
        if: always()
        run: |
          if [ -d "/tmp/cang-ci-sccache-${{ matrix.image_name }}" ]; then
            sudo chown -R "$(id -u):$(id -g)" "/tmp/cang-ci-sccache-${{ matrix.image_name }}"
            chmod -R a+rwX "/tmp/cang-ci-sccache-${{ matrix.image_name }}"
          fi
      - name: Free runner disk before loading ${{ matrix.image_name }} image
        run: |
          df -h
          nix-collect-garbage -d
          docker system prune -af || true
          df -h
      - name: Load ${{ matrix.image_name }} container archive
        run: docker load --input "$(cat "${{ matrix.image_name }}-container-path.txt")"
      - name: Verify ${{ matrix.image_name }} guest init payload
        run: |
          set -euo pipefail

          docker image inspect "${{ matrix.local_image }}" > /dev/null
          docker run --rm --entrypoint "${{ matrix.init_binary }}" "${{ matrix.local_image }}" --help > /dev/null
      - name: Compute image tags
        id: image_meta
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"

          {
            echo "target_image=ghcr.io/${owner}/${{ matrix.image_name }}"
            echo "short_sha=${short_sha}"
          } >> "${GITHUB_OUTPUT}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            {
              echo "tag1=${GITHUB_REF_NAME}"
              echo "tag2=sha-${short_sha}"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "tag1=latest"
              echo "tag2=sha-${short_sha}"
            } >> "${GITHUB_OUTPUT}"
          fi
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag ${{ matrix.image_name }} image for GHCR
        run: |
          set -euo pipefail

          docker tag "${{ matrix.local_image }}" "${{ steps.image_meta.outputs.target_image }}:${{ steps.image_meta.outputs.tag1 }}"
          docker tag "${{ matrix.local_image }}" "${{ steps.image_meta.outputs.target_image }}:${{ steps.image_meta.outputs.tag2 }}"
      - name: Push ${{ matrix.image_name }} image to GHCR
        run: |
          set -euo pipefail

          docker push "${{ steps.image_meta.outputs.target_image }}:${{ steps.image_meta.outputs.tag1 }}"
          docker push "${{ steps.image_meta.outputs.target_image }}:${{ steps.image_meta.outputs.tag2 }}"
