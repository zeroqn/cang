name: Publish release binaries

on:
  push:
    branches:
      - main
    tags:
      - "*"
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: rolling-alpha-release
  cancel-in-progress: true

jobs:
  publish-alpha:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        # No submodule checkout: every step here is a Nix build, and the flake
        # compiles the fork sources from its `libkrun-src`/`libkrunfw-src`/
        # `rutabaga-gfx-src`
        # inputs.

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Require a versioned libkrunfw pin
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail

          # Rolling cang-<sha> libkrunfw prereleases are pruned by the fork CI,
          # so a tagged cang release must pin the permanent
          # v<version>-cang.<n> release that the fork CI never deletes.
          for pin in libkrunfwRelease; do
            tag="$(nix eval --raw --impure --expr "(import ./nix/pins.nix).${pin}.tag")"
            case "${tag}" in
              v[0-9]*-cang.*) ;;
              *)
                echo "refusing to publish a tagged cang release with a rolling fork pin: ${pin} = ${tag}" >&2
                echo "publish a permanent release for ${pin} and re-pin with scripts/update-${pin%Release}.sh --tag v<version>-cang.<n>" >&2
                exit 1
                ;;
            esac
          done

      - name: Restore release sccache
        uses: actions/cache@v6
        with:
          path: /tmp/cang-ci-sccache-release
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-release-${{ hashFiles('Cargo.lock', 'flake.lock', 'nix/pins.nix') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-release-
            sccache-${{ runner.os }}-${{ runner.arch }}-${{ github.workflow }}-

      - name: Prepare release sccache directory
        run: |
          mkdir -p /tmp/cang-ci-sccache-release
          sudo chown -R "$(id -u):$(id -g)" /tmp/cang-ci-sccache-release
          chmod -R a+rwX /tmp/cang-ci-sccache-release

      - name: Build release binaries
        run: |
          set -euo pipefail

          sccache_sandbox_path="/nix/var/cache/sccache=/tmp/cang-ci-sccache-release"

          nix build --option extra-sandbox-paths "${sccache_sandbox_path}" .#cang-ci-sccache -o result-cang

      - name: Normalize release sccache permissions
        if: always()
        run: |
          if [ -d /tmp/cang-ci-sccache-release ]; then
            sudo chown -R "$(id -u):$(id -g)" /tmp/cang-ci-sccache-release
            chmod -R a+rwX /tmp/cang-ci-sccache-release
          fi

      - name: Prepare and smoke-test release artifacts
        id: prep
        run: |
          set -euo pipefail

          arch="$(uname -m)"
          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
          sha_tag="sha-${short_sha}"

          # `cang-*` is the current asset name. Releases published before the
          # rename are still resolvable under their historical `loftd-*` name.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_version="${GITHUB_REF_NAME}"
            cang_asset_name="cang-${release_version}-${arch}-unknown-linux-gnu"
          else
            release_version=""
            cang_asset_name="cang-${arch}-unknown-linux-gnu"
          fi

          if [[ "${cang_asset_name}" == *-linux-flake-locked ]]; then
            echo "refusing legacy cang flake-locked asset name: ${cang_asset_name}" >&2
            exit 1
          fi

          mkdir -p dist
          raw_cang_path="result-cang/bin/cang"
          test -x "${raw_cang_path}"
          if [ "$(dd if="${raw_cang_path}" bs=2 count=1 2>/dev/null)" = "#!" ]; then
            echo "refusing to publish cang wrapper script as ${cang_asset_name}" >&2
            exit 1
          fi
          if [ "$(dd if="${raw_cang_path}" bs=4 count=1 2>/dev/null | od -An -tx1 | tr -d ' \n')" != "7f454c46" ]; then
            echo "refusing to publish non-ELF cang asset ${cang_asset_name}" >&2
            exit 1
          fi
          readelf -h "${raw_cang_path}" > /dev/null
          install -m 0755 "${raw_cang_path}" "dist/${cang_asset_name}"

          case "${arch}" in
            x86_64)
              neutral_loader="/lib64/ld-linux-x86-64.so.2"
              ;;
            aarch64)
              neutral_loader="/lib/ld-linux-aarch64.so.1"
              ;;
            *)
              echo "unsupported cang release architecture for neutral loader: ${arch}" >&2
              exit 1
              ;;
          esac

          nix --extra-experimental-features 'nix-command flakes' shell nixpkgs#patchelf -c \
            patchelf --set-interpreter "${neutral_loader}" --set-rpath "" "dist/${cang_asset_name}"
          readelf -h "dist/${cang_asset_name}" > /dev/null

          if LC_ALL=C grep -aEq '/nix/store/[0-9a-df-np-sv-z]{32}-' "dist/${cang_asset_name}"; then
            echo "refusing to publish cang asset ${cang_asset_name}: neutral asset still contains concrete /nix/store/<hash>- references" >&2
            exit 1
          fi

          result-cang/bin/cang --help > /dev/null

          sha256sum "dist/${cang_asset_name}" > "dist/${cang_asset_name}.sha256"

          {
            echo "cang_asset_name=${cang_asset_name}"
            echo "cang_asset_path=dist/${cang_asset_name}"
            echo "cang_checksum_path=dist/${cang_asset_name}.sha256"
            echo "sha_tag=${sha_tag}"
            echo "release_version=${release_version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest release binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.prep.outputs.cang_asset_path }}

      - name: Write release notes
        run: |
          set -euo pipefail

          revision_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            cat > release-notes.md <<EOF_NOTES
          Versioned release for ${GITHUB_REF_NAME}.

          - Revision: ${GITHUB_SHA}
          - Revision URL: ${revision_url}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Assets:
          - \`${{ steps.prep.outputs.cang_asset_name }}\`: neutral dynamically linked cang ELF packaging input. It is not a standalone portable binary: since cang links libkrun's Rust API it needs \`libvirglrenderer.so.1\` at run time (\`libkrunfw.so.5\` for the firmware), so Nix packaging patches ordinary ELF runtime dependencies and wires libkrunfw/runtime-tool dependencies. Prefer \`nix build .#cang\`, \`nix build .#cang-prebuilt\` once pinned, or the published \`ghcr.io/<repo-owner>/cang\` image for ordinary use.

          The versioned image \`ghcr.io/<repo-owner>/cang:${GITHUB_REF_NAME}\` is published by the image workflow on tag push.
          The matching \`${{ steps.prep.outputs.sha_tag }}\` prerelease is the revision-addressed binary set for this exact revision.
          EOF_NOTES
          else
            cat > release-notes.md <<EOF_NOTES
          Rolling alpha build from main.

          - Revision: ${GITHUB_SHA}
          - Revision URL: ${revision_url}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Assets:
          - \`${{ steps.prep.outputs.cang_asset_name }}\`: neutral dynamically linked cang ELF packaging input. It is not a standalone portable binary: since cang links libkrun's Rust API it needs \`libvirglrenderer.so.1\` at run time (\`libkrunfw.so.5\` for the firmware), so Nix packaging patches ordinary ELF runtime dependencies and wires libkrunfw/runtime-tool dependencies. Prefer \`nix build .#cang\`, \`nix build .#cang-prebuilt\` once pinned, or the published \`ghcr.io/<repo-owner>/cang\` image for ordinary use.

          The \`alpha\` prerelease is reused on every push to main.
          The matching \`${{ steps.prep.outputs.sha_tag }}\` prerelease is the revision-addressed binary set for this exact revision.
          EOF_NOTES
          fi

      - name: Create or update rolling alpha release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view alpha >/dev/null 2>&1; then
            gh release edit alpha \
              --title "alpha" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create alpha \
              --title "alpha" \
              --notes-file release-notes.md \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

      - name: Create versioned release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.prep.outputs.release_version }}
        run: |
          set -euo pipefail

          gh release create "${RELEASE_VERSION}" \
            --title "${RELEASE_VERSION}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}"

      - name: Create or update immutable sha release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_TAG: ${{ steps.prep.outputs.sha_tag }}
        run: |
          set -euo pipefail

          if gh release view "${SHA_TAG}" >/dev/null 2>&1; then
            gh release edit "${SHA_TAG}" \
              --title "${SHA_TAG}" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "${SHA_TAG}" \
              --title "${SHA_TAG}" \
              --notes-file release-notes.md \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi


      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          CANG_ASSET_PATH: ${{ steps.prep.outputs.cang_asset_path }}
          CANG_CHECKSUM_PATH: ${{ steps.prep.outputs.cang_checksum_path }}
          RELEASE_VERSION: ${{ steps.prep.outputs.release_version }}
          SHA_TAG: ${{ steps.prep.outputs.sha_tag }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            gh release upload alpha \
              "${CANG_ASSET_PATH}" \
              "${CANG_CHECKSUM_PATH}" \
              --clobber
          else
            gh release upload "${RELEASE_VERSION}" \
              "${CANG_ASSET_PATH}" \
              "${CANG_CHECKSUM_PATH}" \
              --clobber
          fi

          gh release upload "${SHA_TAG}" \
            "${CANG_ASSET_PATH}" \
            "${CANG_CHECKSUM_PATH}" \
            --clobber

      - name: Prune old sha releases
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_TAG: ${{ steps.prep.outputs.sha_tag }}
        run: |
          set -euo pipefail

          mapfile -t stale_tags < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" |
              jq -sr '
                add
                | map(select(.tag_name | startswith("sha-")))
                | sort_by(.published_at // .created_at)
                | reverse
                | .[20:]
                | .[].tag_name
              '
          )

          for tag in "${stale_tags[@]}"; do
            # Only rolling dev releases are prunable. Tagged releases such as
            # v0.6.7 are permanent, so fail closed if the selection above ever
            # yields anything that is not a sha-<revision> dev tag.
            case "${tag}" in
              sha-*) ;;
              *)
                echo "refusing to prune non-dev release: ${tag}" >&2
                exit 1
                ;;
            esac

            if [ -n "${tag}" ] && [ "${tag}" != "${SHA_TAG}" ]; then
              gh release delete "${tag}" --cleanup-tag -y
            fi
          done
