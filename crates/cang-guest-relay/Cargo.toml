[package]
name = "cang-guest-relay"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "cang-guest-relay"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
rustfs-mimalloc.workspace = true
# The guest half of the reverse share, straight from upstream rather than the
# crates.io release cang used to vendor: the git tree carries the `async-io`
# path (and the `fusedev-uring` transport) the registered 0.12.1 does not, and
# pinning a revision keeps the source reproducible while that work is
# unreleased. `rev` is the whole pin - bumping it is the only way the guest
# relay's FUSE implementation moves.
fuse-backend-rs = { git = "https://github.com/cloud-hypervisor/fuse-backend-rs", rev = "506952b947cf4346d68550ebead4d244e2ad4a15", default-features = false, features = [
  "fusedev",
] }

[dev-dependencies]
tempfile.workspace = true
