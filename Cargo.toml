[workspace]
members = [
  "crates/cang",
  "crates/cang-libkrun",
  "crates/cang-guest-init",
  "crates/cang-guest-relay",
  "crates/cang-relay-pump",
  "crates/cang-attach-protocol",
  "crates/cang-exec-protocol",
  "crates/cang-repository-tests",
]
default-members = [
  "crates/cang",
  "crates/cang-libkrun",
  "crates/cang-guest-init",
  "crates/cang-guest-relay",
  "crates/cang-relay-pump",
  "crates/cang-attach-protocol",
  "crates/cang-exec-protocol",
  "crates/cang-repository-tests",
]
resolver = "3"
# `cang-libkrun` depends on libkrun's source under `deps/libkrun` by path. Without
# this exclusion cargo auto-enrolls that tree (and everything under deps/) into
# this workspace, which turns `cargo test --workspace` into a run of libkrun's own
# test targets and takes its crates out of lint-capping - neither is wanted, the
# dependency is meant to be a dependency.
# A path dependency that lives inside a member's directory would otherwise be
# enrolled as a workspace member, which would put a foreign tree's formatting
# and lints under `cargo fmt --check` and `clippy -D warnings`.
exclude = ["deps"]

[workspace.package]
version = "0.26.3"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
libc = "0.2"
landlock = "0.4"
# mimalloc, taken from Microsoft's own repository rather than a crates.io
# wrapper: the bindings live at `contrib/rust` of the mimalloc tree (`mimalloc`
# + `mimalloc-sys`), so one `tag` pins the C sources and the Rust API
# together, and the linked allocator is the same release the guest image
# preloads (`nix/lib/mimalloc-cang.nix`).
#
# `secure` is the C library's `MI_SECURE=ON`. Its `MI_PROFILE` default (1,
# "fast, can be enabled always" - `include/mimalloc/config.h`) is left in
# place: cang never registers a profiler, so no sample is ever taken.
mimalloc = { git = "https://github.com/microsoft/mimalloc", tag = "v3.7.1", features = [ "secure" ] }
cang-attach-protocol = { path = "crates/cang-attach-protocol" }
cang-libkrun = { path = "crates/cang-libkrun" }
cang-exec-protocol = { path = "crates/cang-exec-protocol" }
seccompiler = { version = "0.5", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }
vt100 = "0.16"

# libkrun's GPU device depends on `rutabaga_gfx`, which pins the fork differently
# for cang than upstream does: the fork carries `VIRGL_RENDERER_USE_VIDEO`, the
# flag cang asks for through `--gpu=drm` (see docs/vaapi-video-investigation.md).
# cang compiles the checkout at `deps/rutabaga_gfx` (a submodule, grafted into a
# Nix build by nix/pkgs/workspace-src.nix) rather than the revision libkrun's own
# manifest names, so a local patch to the video path needs no fork commit and no
# re-fetch - the same shape as `deps/libkrun`. libkrun's revision stays the
# fallback for a build of the fork on its own.
[patch."https://github.com/zeroqn/rutabaga_gfx"]
rutabaga_gfx = { path = "deps/rutabaga_gfx" }

[profile.release]
lto = "thin"
