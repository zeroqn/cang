[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  # libkrun's dependency graph (krun-devices, rutabaga_gfx, zstd/bzip2 build
  # helpers, ...) is permissive but wider than cang's own crates were: cang now
  # compiles libkrun's Rust API out of `deps/libkrun`, so its licenses are part
  # of cang's graph. All four are OSI-approved and copyleft-free.
  "BSD-3-Clause",
  "ISC",
  "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# `cang-guest-relay` takes `fuse-backend-rs` from its upstream git tree, pinned
# by `rev` in that crate's manifest: the registered release does not carry the
# `async-io` path cang wants.
allow-git = ["https://github.com/cloud-hypervisor/fuse-backend-rs"]
