[advisories]
# RUSTSEC-2025-0141 reports `bincode` as unmaintained (the upstream team stopped
# development; v3 is a rewrite, so "no safe upgrade is available"), not as a
# vulnerability. It enters cang's graph with the libkrun bump, through upstream's
# guest-init control protocol: `krun-init-blob` -> `krun-init-common` -> bincode.
# cang never sets the init config's `control_socket`, and the blob emits a
# `control_server` only for that case, so the guest init starts no control server
# and bincode's wire format is not on cang's path. The ignore goes when upstream
# replaces its codec.
ignore = ["RUSTSEC-2025-0141"]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  # libkrun's dependency graph (krun-devices, rutabaga_gfx, zstd/bzip2 build
  # helpers, ...) is permissive but wider than cang's own crates were: cang now
  # compiles libkrun's Rust API out of `deps/libkrun`, so its licenses are part
  # of cang's graph. All four are OSI-approved and copyleft-free.
  "BSD-3-Clause",
  "ISC",
  "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# `cang-guest-relay` takes `fuse-backend-rs` from a git tree, pinned by `rev` in
# that crate's manifest: the registered release does not carry the `async-io`
# path cang wants. The tree is `zeroqn/fuse-backend-rs` @ `cang`, which is
# upstream plus one commit that opens the parent inode above the `set_creds`
# scope in `mkdir`/`symlink` (see that crate's manifest for why).
#
# `mimalloc` and `mimalloc-sys` come from Microsoft's own mimalloc tree too
# (`contrib/rust`), pinned by `tag = "v3.7.1"`: no release of that official
# crate is published to crates.io, and one tag pins the C sources and the
# bindings together (see the workspace manifest).
allow-git = [
  "https://github.com/zeroqn/fuse-backend-rs",
  "https://github.com/microsoft/mimalloc",
]
